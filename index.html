<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moons · Cookbook</title>
    <style>
      :root { --ink: #1a1c1e; --muted: #5b6470; --line: #d6dae0; --bg: #f6f7f9; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; color: var(--ink); background: var(--bg); }
      a { color: #1f4bd8; text-decoration: none; }
      a:hover { text-decoration: underline; }
      .shell { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
      .nav { display: flex; gap: 14px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; margin-bottom: 20px; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
      h1 { font-size: 22px; margin: 0 0 6px; }
      .meta { color: var(--muted); }
      .error { border: 1px solid #e5b4b0; background: #fdeceb; color: #b3261e; padding: 8px 10px; }
      .okmsg { color: #1d7a46; }
      input { padding: 4px 8px; border: 1px solid var(--line); font: inherit; }
      button { padding: 4px 12px; border: 1px solid var(--ink); background: #fff; font: inherit; cursor: pointer; }
      button:hover { background: #eceff3; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
